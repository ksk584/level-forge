[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levelforge"
version = "0.1.0"
description = "A Genetic Algorithm and Deep Q-Network framework for adversarial Sokoban level generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mrinal S (1RV24IS075)" },
    { name = "Kiran S K (1RV24IS057)" },
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
viz = ["PyQt5>=5.15"]
dev = ["pytest>=8"]

[project.scripts]
levelforge = "levelforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
